<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0A0A0A;--fg:#E3E3E3;--accent:#FFDFAB;
  --border:#252525;--muted:#777;--card:#111111;
}
body{width:300px;background:var(--bg);color:var(--fg);font-family:'Onest',sans-serif}
header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;gap:10px}
header h1{font-family:'Onest',sans-serif;font-size:17px;font-weight:700;flex:1;color:var(--accent)}
.logo{width:28px;height:28px;background:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#0A0A0A}
section{padding:18px}
#capture-btn{width:100%;padding:10px;background:var(--accent);color:#0A0A0A;border:none;border-radius:8px;font-family:'Onest',sans-serif;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .18s}
#capture-btn:hover{opacity:0.85}
.divider{height:1px;background:var(--border);margin:4px 0}
footer{border-top:1px solid var(--border);padding:9px 18px;font-size:11px;color:var(--muted);text-align:center}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
#gdoc-input{width:100%;padding:8px 10px;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:6px;font-family:'Onest',sans-serif;font-size:13px;margin-bottom:6px}
#gdoc-input:focus{outline:1px solid var(--accent)}
#gdoc-status{font-size:11px;color:var(--muted);min-height:14px}
#gdoc-status.saved{color:var(--accent)}
.ai-input{width:100%;padding:8px 10px;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:6px;font:13px 'Onest',sans-serif;margin-bottom:10px}
.ai-input:focus{outline:1px solid var(--accent)}
#ai-save-btn{padding:8px 12px;background:var(--accent);color:var(--bg);border:0;border-radius:6px;font-weight:600;cursor:pointer}
#ai-settings-status{font-size:11px;color:var(--muted);margin-top:8px;min-height:14px;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
  <div class="logo">⬡</div>
  <h1>MDEV QA Reporter</h1>
</header>
<section>
  <button id="capture-btn">
    <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="15" rx="2"/><path d="M8 21h8M12 18v3"/></svg>
    Capture Screenshot
  </button>
</section>
<div class="divider"></div>
<section>
  <label for="gdoc-input">Google Doc (link or ID) for reports</label>
  <input type="text" id="gdoc-input" placeholder="https://docs.google.com/document/d/…">
  <div id="gdoc-status"></div>
</section>
<div class="divider"></div>
<section>
  <form id="ai-settings-form">
    <label for="ai-worker-url">Cloudflare AI Worker URL</label>
    <input class="ai-input" type="url" id="ai-worker-url" placeholder="https://mdev-qa-ai.your-subdomain.workers.dev" required autocomplete="off">
    <label for="ai-worker-token">AI endpoint token</label>
    <input class="ai-input" type="password" id="ai-worker-token" required autocomplete="off" spellcheck="false">
    <button type="submit" id="ai-save-btn">Save AI settings</button>
    <div id="ai-settings-status" role="status" aria-live="polite"></div>
  </form>
</section>
<footer>Personal QA Reporter · Notion</footer>
<script src="ai-client.js"></script>
<script src="popup.js"></script>
</body>
</html>
